<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar">
    <div class="nav-brand">
        <a th:href="@{/}">CineCircle</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">Catalog</a></li>
        <li><a th:href="@{/recommender}">Tonight's Pick</a></li>
        <li><a th:href="@{/watchlist}">Watchlist</a></li>
        <li><a th:href="@{/lobby}">Group Lobby</a></li>
        <li><a th:href="@{/clubs}">Clubs</a></li>
        <li><a th:href="@{/stats}">Watch-Wrapped</a></li>
    </ul>
    <div class="nav-auth">
        <span sec:authorize="isAuthenticated()" class="user-badge">
            <span sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-outline">Logout</button>
            </form>
        </span>
        <span sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn-primary">Login</a>
            <a th:href="@{/register}" class="btn-outline">Sign Up</a>
        </span>
    </div>
</nav>
</body>
</html>
