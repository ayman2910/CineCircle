<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — CineCircle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-container">
        <h2>Sign In to CineCircle</h2>
        <p th:if="${param.error}" class="alert-error">Invalid email or password.</p>
        <p th:if="${param.registered}" class="alert-success">Account created! You can now log in.</p>
        <form th:action="@{/login}" method="post" class="auth-form">
            <label>Email</label>
            <input type="email" name="username" required placeholder="ayman@cinecircle.com">
            <label>Password</label>
            <input type="password" name="password" required placeholder="password123">
            <button type="submit" class="btn-primary full-width">Login</button>
        </form>
        <p class="auth-footer">New here? <a th:href="@{/register}">Create an account</a></p>
    </main>
</body>
</html>
