<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineCircle — Discover, Match &amp; Watch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <header class="hero">
            <h1>CineCircle</h1>
            <p>End movie-night indecision. Filter by vibe, match tastes with friends, and discuss shows spoiler-free.</p>
        </header>

        <section>
            <h2 class="section-title">Featured Catalog</h2>
            <div class="media-grid">
                <div class="media-card" th:each="item : ${mediaList}">
                    <img th:src="'https://image.tmdb.org/t/p/w500' + ${item.posterPath}"
                         th:alt="${item.title}"
                         onerror="this.src='https://via.placeholder.com/300x450/1e293b/94a3b8?text=Poster'"/>
                    <div class="card-body">
                        <span class="badge" th:text="${item.mediaType}">MOVIE</span>
                        <span class="badge safe" th:if="${item.familySafe}">Family Safe</span>
                        <h3 th:text="${item.title}">Title</h3>
                        <p class="meta">
                            <span th:text="${item.genre}">Genre</span> &bull;
                            <span th:text="${item.runtimeMinutes} + ' min'">120 min</span>
                        </p>
                        <p class="vibes" th:text="${item.vibeTags}">Vibes</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
