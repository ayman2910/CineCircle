spring.application.name=CineCircle
server.port=8080

# Automatically loads your private application-local.properties file
spring.config.import=optional:classpath:application-local.properties

# Placeholders (overridden by application-local.properties on your PC)
spring.datasource.url=jdbc:postgresql://localhost:5432/cinecircle
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Set to 'never' because your 27 Neon tables are already created
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

spring.thymeleaf.cache=false

tmdb.api.key=YOUR_TMDB_API_KEY_HERE
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p/w500
